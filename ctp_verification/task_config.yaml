# 任务说明配置文件
# 每个任务包含标题和内容

0:
  title: 2.1连通性
  content: |
    测试目的：确认测试账号可通过交易信息系统认证并成功登录，网络与系统连接畅通。
    测试步骤：
    1. 使用测试账号登录系统。
    2. 记录提示信息并截图保存。
    图片要求：
    上传状态"已连接/登录成功"界面截图。

1:
  title: 2.2基础交易功能-测试点1-开仓操作
  content: |
    测试目的：验证可正确地下达开仓指令并处理委托回报。
    测试步骤：
    1. 下达开仓报单。
    2. 核对回报信息。
    3. 上传开仓操作相关截图。
    图片要求：
    上传包含开仓委托下单界面、委托信息界面。

2:
  title: 2.2基础交易功能-测试点2-平仓操作
  content: |
    测试目的：验证可正确地下达平仓指令并处理委托回报。
    测试步骤：
    1. 下达平仓报单。
    2. 核对回报信息。
    3. 上传平仓操作相关截图。
    图片要求：
    上传包含平仓委托下单界面、委托信息界面。

3:
  title: 2.2基础交易功能-测试点3-撤单操作
  content: |
    测试目的：验证可正确地下达撤单指令并处理委托回报。
    测试步骤：
    1. 使用任务1或者任务2的信息，进行撤单操作。
    2. 上传撤单操作相关截图。
    图片要求：
    上传包含撤单委托下单界面、委托信息界面。

4:
  title: 2.3.系统连接异常监测功能-测试点1-系统连接成功
  content: |
    测试目的：当与柜台交易连接时，系统可及时识别并记录，界面给出合理提示。
    测试步骤：
    1. 与柜台交易连接成功时，观察终端或者控制台。
    2. 连接成功后提示，上传相关截图。
    图片要求：
    上传系统连接成功状态截图。

5:
  title: 2.3.系统连接异常监测功能-测试点2-连接断开时的监测告警
  content: |
    测试目的：当网络或服务异常时，系统可及时识别并记录，界面给出可理解提示。
    测试步骤：
    1. 模拟断网/服务异常，观察终端或者控制台。
    2. 连接断开后提示，上传相关截图。
    图片要求：
    上传连接断开时的监测告警截图。

6:
  title: 2.3.系统连接异常监测功能-测试点3-重新连接成功
  content: |
    测试目的：当网络或服务恢复时，系统可及时识别并记录，界面给出可理解提示。
    测试步骤：
    1. 模拟断网/服务恢复，观察终端或者控制台。
    2. 恢复后校验记录与恢复提示，上传相关截图。
    图片要求：
    上传重新连接成功截图。

7:
  title: 2.4.报撤单笔数监测功能-测试点1-报单笔数统计
  content: |
    测试目的：验证能正常统计报单笔数。
    测试步骤：
    1. 进行多笔报单、查看统计面板与趋势。
    2. 记录报单笔数统计情况，上传报单统计过程的截图。
    图片要求：
    上传包含报单委托下达、报单笔数统计过程的截图。

8:
  title: 2.4.报撤单笔数监测功能-测试点2-撤单笔数统计
  content: |
    测试目的：验证能正常统计撤单笔数。
    测试步骤：
    1. 进行多笔撤单、查看统计面板与趋势。
    2. 记录撤单笔数统计情况，上传撤单统计过程的截图。
    图片要求：
    上传包含撤单委托下达、撤单笔数统计过程的截图。

9:
  title: 2.5.重复报单监测功能(选测项目)-测试点1-重复开仓检测
  content: |
    测试目的：验证能正常统计重复下达买卖方向、委托数量、委托价格均相同的交易指令开仓单的报单笔数。
    测试步骤：
    1. 连续两次提交相同开仓报单。
    2. 观察系统提示或拦截，上传重复开仓提示或拦截的截图。
    图片要求：
    上传包含重复开仓的委托、重复报单提示/拦截的截图。

10:
  title: 2.5.重复报单监测功能(选测项目)-测试点2-重复平仓检测
  content: |
    测试目的：验证能正常统计重复下达买卖方向、委托数量、委托价格均相同的交易指令平仓单的报单笔数。
    测试步骤：
    1. 连续两次提交相同平仓报单。
    2. 观察系统提示或拦截，上传重复平仓提示或拦截的截图。
    图片要求：
    上传包含重复平仓的委托、重复报单提示/拦截的截图。


11:
  title: 2.5.重复报单监测功能(选测项目)-测试点3-重复撤单检测
  content: |
    测试目的：验证能正常统计重复下达买卖方向、委托数量、委托价格均相同的交易指令撤单的报单笔数。
    测试步骤：
    1. 连续两次提交相同撤单报单。
    2. 观察系统提示或拦截，上传重复撤单提示或拦截的截图。
    图片要求：
    上传包含重复撤单的委托、重复报单提示/拦截的截图。

12:
  title: 2.6.阈值设置及预警功能-测试点1-报单笔数阈值设置
  content: |
    测试目的：验证报单笔数统计阈值设置功能。
    测试步骤：
    1. 设置报单笔数监测阈值。
    2. 截取报单阈值设置截图。
    图片要求：
    上传报单阈值配置截图。
    注：12、13、14、15截图编号，报撤单笔数、报单笔数、撤单笔数三者有其二即可。

13:
  title: 2.6.阈值设置及预警功能-测试点2-报单笔数达到阈值警示
  content: |
    测试目的：验证报单笔数统计值达到或超过阈值时会给予警示。
    测试步骤：
    1. 设置报单监测阈值。
    2. 制造达到或超过阈值的触发条件。
    3. 验证预警产生，截图保存结果。
    图片要求：
    上传报单笔数达到阈值的截图以及对接警示相关截图。
    注：12、13、14、15截图编号，报撤单笔数、报单笔数、撤单笔数三者有其二即可。

14:
  title: 2.6.阈值设置及预警功能-测试点3-撤单笔数阈值设置
  content: |
    测试目的：验证撤单笔数统计阈值设置功能。
    测试步骤：
    1. 设置撤单笔数监测阈值。
    2. 截取撤单阈值设置截图。
    图片要求：
    上传撤单笔数达到阈值的设置相关截图。
    注：12、13、14、15截图编号，报撤单笔数、报单笔数、撤单笔数三者有其二即可。
    

15:
  title: 2.6.阈值设置及预警功能-测试点4-撤单笔数达到阈值警示
  content: |
    测试目的：验证撤单笔数统计值达到或超过阈值时会给予警示。
    测试步骤：
    1. 设置撤单监测阈值。
    2. 制造达到或超过阈值的触发条件。
    3. 验证预警产生，截图保存结果。
    图片要求：
    上传撤单笔数达到阈值的截图以及对接警示相关截图。
    注：12、13、14、15截图编号，报撤单笔数、报单笔数、撤单笔数三者有其二即可。
    
16:
  title: 2.6.阈值设置及预警功能-测试点5-重复报单笔数阈值设置（选测）
  content: |
    测试目的：验证重复报单笔数统计阈值设置功能。
    测试步骤：
    1. 设置重复报单笔数监测阈值。
    2. 截取重置报单阈值设置截图。
    图片要求：
    上传报单阈值配置截图。

17:
  title: 2.6.阈值设置及预警功能-测试点6-重复报单笔数达到阈值警示（选测）
  content: |
    测试目的：可配置阈值并在达到阈值时触发预警，提示清晰。
    测试步骤：
    1. 设置重复报单监测阈值。
    2. 制造达到或超过阈值的触发条件。
    3. 验证预警产生，截图保存结果。
    图片要求：
    上传重复报单笔数达到阈值的截图以及对接警示相关截图。

18:
  title: 2.7.交易指令检查功能-测试点1-合约代码错误检测
  content: |
    测试目的：验证订单合约代码错误时，终端系统能检查出错误并拒绝报单。
    测试步骤：
    1. 构造错误的合约代码委托。
    2. 进行报单并观察终端系统校验提示，截图保存结果。
    图片要求：
    上传包含终端系统合约代码错误提示截图、委托下单失败截图。

19:
  title: 2.7.交易指令检查功能-测试点2-不符合最小变动价位的价格检测
  content: |
    测试目的：验证订单价格的最小变动价位错误时，终端系统能检查出错误并拒绝报单。
    测试步骤：
    1. 构造不符合最小变动价位的价格委托。
    2. 进行报单并观察终端系统校验提示，截图保存结果。
    图片要求：
    上传包含终端系统不符合最小变动价位价格的错误提示截图、委托下单失败截图。

20:
  title: 2.7.交易指令检查功能-测试点3-超过单笔最大委托手数检测
  content: |
    测试目的：验证订单委托数量超单笔最大委托数量时，系统能检查出错误并拒绝报单。
    测试步骤：
    1. 构造委托数量超过单笔最大委托数量的委托。
    2. 进行报单并观察终端系统校验提示，截图保存结果。
    图片要求：
    上传包含终端系统委托数量超单笔最大委托数量的错误提示截图、委托下单失败截图。

21:
  title: 2.8.错误提示功能-测试点1-资金不足错误提示
  content: |
    测试目的：验证系统能正常接收并展示柜台返回的资金不足错误码。
    测试步骤：
    1. 终端系统资金不足时，下达委托。
    2. 终端能接受柜台返回的错误提示并正确错误码和报错信息，截图保存结果。
    图片要求：
    上传包含终端系统资金不足时委托下单界面、能正常接受并展示柜台错误信息的委托信息截图。

22:
  title: 2.8.错误提示功能-测试点2-持仓不足错误提示
  content: |
    测试目的：验证系统能正常接收并展示柜台返回的持仓不足错误码。
    测试步骤：
    1. 下达开仓报单。
    2. 下达委托数量大于开仓的平仓报单。
    3. 终端能接受柜台返回的错误提示并正确错误码和报错信息，截图保存结果。
    图片要求：
    上传包含终端系统持仓不足时委托下单界面、能正常接受并展示柜台错误信息的委托信息截图。

23:
  title: 2.8.错误提示功能-测试点3-市场状态错误提示
  content: |
    测试目的：验证系统在非交易时间能正常接收并展示柜台返回的市场状态错误码。
    测试步骤：
    1. 终端系统非交易时间，下达委托。
    2. 终端能接受柜台返回的错误提示并正确错误码和报错信息，截图保存结果。
    图片要求：
    上传包含终端系统非交易时间时委托下单界面、能正常接受并展示柜台错误信息的委托信息截图。

24:
  title: 2.9.暂停交易功能-测试点1-限制交易权限
  content: |
    测试目的：验证系统可通过限制账号交易权限方式暂停程序化交易。
    测试步骤：
    1. 修改账号的交易权限。
    2. 验证程序化交易下单受控与提示。
    3. 关闭后恢复。
    4. 记录截图。
    图片要求：
    上传限制交易账号交易权限功能截图及成功通过其暂停程序化交易截图。
    注：24、25、26截图编号，三者有一种满足即可。

25:
  title: 2.9.暂停交易功能-测试点2-暂停交易策略
  content: |
    测试目的：验证系统可通过暂停程序化策略执行方式暂停程序化交易。
    测试步骤：
    1. 启用暂停程序化交易开关。
    2. 验证程序化交易下单受控与提示。
    3. 启动程序化策略后恢复。
    4. 记录截图。
    图片要求：
    上传暂停程序化策略执行功能截图及成功通过其暂停程序化交易截图。
    注：24、25、26截图编号，三者有一种满足即可。

26:
  title: 2.9.暂停交易功能-测试点3-强制退出交易
  content: |
    测试目的：验证系统可通过强制账号退出执行方式暂停程序化交易。
    测试步骤：
    1. 构造账号强制退出情况。
    2. 验证下单受控与提示。
    3. 账号登录后恢复。
    4. 记录截图。
    图片要求：
    上传强制账号退出功能截图及成功通过其暂停程序化交易截图。
    注：24、25、26截图编号，三者有一种满足即可。

27:
  title: 2.10.批量撤单功能(选测项目)-测试点1-部分成交订单批量撤单
  content: |
    测试目的：验证系统支持将多笔部分成交的报单进行批量撤单。
    测试步骤：
    1. 勾选多笔部分成交订单，进行批量撤单操作。
    2. 触发批量撤单警示。
    3. 校验执行结果。
    4. 记录截图。
    图片要求：
    上传批量撤单功能截图及多笔部分成交报单撤单成功截图。

28:
  title: 2.10.批量撤单功能(选测项目)-测试点2-多笔已报单批量撤单
  content: |
    测试目的：验证系统支持将多笔已报单进行批量撤单。
    测试步骤：
    1. 勾选多笔已报订单，进行批量撤单操作。
    2. 触发批量撤单警示。
    3. 校验执行结果。
    4. 记录截图。
    图片要求：
    上传批量撤单功能截图及多笔已报单撤单成功截图。

29:
  title: 2.11.日志记录功能-测试点1-交易日志
  content: |
    测试目的：验证系统日志具备日志记录功能，且能够满足业务追溯交易记录信息。
    测试步骤：
    1. 执行核心操作（2.1连通性、2.2基础交易功能、2.10批量撤单功能-选测项）。
    2. 在日志中心检索。
    3. 导出或截图留存。
    图片要求：
    上传包含（2.1连通性、2.2基础交易功能、2.10批量撤单功能-选测项）交易日志截图。

30:
  title: 2.11.日志记录功能-测试点2-系统运行日志
  content: |
    测试目的：验证系统日志具备日志记录功能，且能够满足业务追溯系统运行信息。
    测试步骤：
    1. 执行核心操作（2.3.系统连接异常监测功能、2.9.暂停交易功能）。
    2. 在日志中心检索。
    3. 导出或截图留存。
    图片要求：
    上传包含（2.3.系统连接异常监测功能、2.9.暂停交易功能）系统运行日志截图。

31:
  title: 2.11.日志记录功能-测试点3-监测信息日志
  content: |
    测试目的：验证系统日志具备日志记录功能，且能够满足业务追溯监测记录信息。
    测试步骤：
    1. 执行核心操作（2.4.报撤单笔数监测功能、2.5.重复报单监测功能-选测项、2.6.阈值设置及预警功能）。
    2. 在日志中心检索。
    3. 导出或截图留存。
    图片要求：
    上传包含（2.4.报撤单笔数监测功能、2.5.重复报单监测功能-选测项、2.6.阈值设置及预警功能）监测日志截图。

32:
  title: 2.11.日志记录功能-测试点4-错误提示信息日志
  content: |
    测试目的：验证系统日志具备日志记录功能，且能够满足业务追溯系统记录错误提示信息。
    测试步骤：
    1. 执行核心操作（2.7.交易指令检查功能、2.8.错误提示功能）。
    2. 在日志中心检索。
    3. 导出或截图留存。
    图片要求：
    包含（2.7.交易指令检查功能、2.8.错误提示功能）错误提示日志截图。
    
